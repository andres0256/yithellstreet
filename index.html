<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.jpg">

    <title>yithell</title>
    <style>
        /* Fondo negro y centrado absoluto en la página */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* Fondo negro absoluto */
            font-family: 'Arial Black', Gadget, sans-serif; /* Fuente imponente */
        }

        .boton-enlace {
            position: relative;
            display: inline-block;
            text-decoration: none;
            padding: 20px 55px;
            border-radius: 10px;
            border: 2px solid #111111;
            font-size: 26px;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 4px;
            background: #050505;
            overflow: hidden;
            box-shadow: 0 0 0 0 transparent;
            cursor: pointer;
            
            -webkit-transition: all 0.3s ease-in;
            -moz-transition: all 0.3s ease-in;
            transition: all 0.3s ease-in;
        }

        /* EFECTO MITAD AZUL CLARO Y MITAD BLANCO EN EL TEXTO */
       .texto-boton {
    background: linear-gradient(90deg, #00e5ff 50%, #ffffff 50%);
    -webkit-background-clip: text;
    background-clip: text; /* Propiedad estándar */
    -webkit-text-fill-color: transparent;
    display: inline-block;
    opacity: 0.3;
    transition: opacity 0.3s ease-in;
}

        /* HOVER: Encendido del texto y del botón */
        .boton-enlace:hover {
            background: #00101a; /* Fondo azul muy oscuro */
            border-color: #00e5ff; /* Borde azul claro neón */
            
            /* Sombra neón azul y relieve 3D */
            box-shadow: 0 0 15px #00e5ff, 
                        0 0 40px rgba(0, 229, 255, 0.4),
                        0 6px 0px #00e5ff;
            
            transform: translateY(-4px);

            -webkit-transition: all 0.2s ease-out;
            -moz-transition: all 0.2s ease-out;
            transition: all 0.2s ease-out;
        }

        /* El texto se ilumina al máximo en hover */
        .boton-enlace:hover .texto-boton {
            opacity: 1;
        }

        /* Efecto de destello de luz blanco cruzando el botón */
        .boton-enlace:hover::before {
            -webkit-animation: sh02 0.5s 0s linear;
            -moz-animation: sh02 0.5s 0s linear;
            animation: sh02 0.5s 0s linear;
        }

        .boton-enlace::before {
            content: '';
            display: block;
            width: 0px;
            height: 86%;
            position: absolute;
            top: 7%;
            left: 0%;
            opacity: 0;
            background: #fff;
            box-shadow: 0 0 50px 30px #fff;
            -webkit-transform: skewX(-20deg);
            -moz-transform: skewX(-20deg);
            -ms-transform: skewX(-20deg);
            -o-transform: skewX(-20deg);
            transform: skewX(-20deg);
        }

        /* Animación del destello */
        @keyframes sh02 {
            from {
                opacity: 0;
                left: 0%;
            }
            50% {
                opacity: 1;
            }
            to {
                opacity: 0;
                left: 100%;
            }
        }

        /* Al hacer clic (Pulsación 3D) */
        .boton-enlace:active {
            transform: translateY(2px);
            box-shadow: 0 0 10px #00e5ff, 
                        0 2px 0px #00e5ff;
            
            -webkit-transition: box-shadow 0.1s ease-in;
            -moz-transition: box-shadow 0.1s ease-in;
            transition: box-shadow 0.1s ease-in;
        }
    </style>
</head>
<body>

    <a href="inicio.html" class="boton-enlace">
        <span class="texto-boton">yithell</span>
    </a>

</body>
</html>
